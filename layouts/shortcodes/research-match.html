{{/* Research Match — visitor types interest, agent recommends relevant papers */}}
<div class="qs-match" id="qs-match">
  <div class="qs-match__inner">
    <h3 class="qs-match__title">Find your match</h3>
    <p class="qs-match__lead">Describe your research interest — I'll match you with Qi Sun's most relevant work.</p>
    <form class="qs-match__form" id="qs-match-form">
      <input class="qs-match__input" type="text" id="qs-match-input"
        placeholder="e.g. anomaly detection in multivariate time series" maxlength="200" />
      <button class="qs-match__btn" type="submit">Match</button>
    </form>
    <div class="qs-match__result" id="qs-match-result" hidden></div>
  </div>
</div>
