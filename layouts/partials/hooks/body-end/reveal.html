{{/* Subtle entrance motion for homepage sections */}}
<script>
(function () {
  if (window.matchMedia("(prefers-reduced-motion: reduce)").matches) return;
  var nodes = document.querySelectorAll(".hbb-section");
  if (!nodes.length || !("IntersectionObserver" in window)) return;
  nodes.forEach(function (el, i) {
    el.classList.add("qs-reveal");
    el.style.setProperty("--qs-reveal-delay", Math.min(i * 60, 240) + "ms");
  });
  var io = new IntersectionObserver(
    function (entries) {
      entries.forEach(function (entry) {
        if (entry.isIntersecting) {
          entry.target.classList.add("qs-reveal--in");
          io.unobserve(entry.target);
        }
      });
    },
    { rootMargin: "0px 0px -8% 0px", threshold: 0.08 }
  );
  nodes.forEach(function (el) { io.observe(el); });
})();
</script>
