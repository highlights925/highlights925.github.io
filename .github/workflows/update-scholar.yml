name: Refresh Google Scholar research data

on:
  schedule:
    - cron: '23 3 * * 1'
  workflow_dispatch:

concurrency:
  group: hugo-pages-deploy
  cancel-in-progress: false

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Refresh profile snapshot
        run: python3 scripts/update_scholar.py
      - name: Commit updated snapshot
        id: commit
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if git diff --quiet -- data/scholar.json; then
            echo "Scholar data is unchanged"
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add data/scholar.json
            git commit -m "data: refresh Google Scholar profile"
            git push
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi
      - name: Setup Hugo
        if: steps.commit.outputs.changed == 'true'
        uses: peaceiris/actions-hugo@v2
        with:
          hugo-version: '0.136.5'
          extended: true
      - name: Setup Pages
        if: steps.commit.outputs.changed == 'true'
        id: pages
        uses: actions/configure-pages@v5
      - name: Build site
        if: steps.commit.outputs.changed == 'true'
        env:
          HUGO_ENVIRONMENT: production
        run: hugo --minify --baseURL "${{ steps.pages.outputs.base_url }}/"
      - name: Generate Pagefind index
        if: steps.commit.outputs.changed == 'true'
        run: npx pagefind --site public
      - name: Ensure .nojekyll
        if: steps.commit.outputs.changed == 'true'
        run: touch public/.nojekyll
      - name: Upload Pages artifact
        if: steps.commit.outputs.changed == 'true'
        uses: actions/upload-pages-artifact@v3
        with:
          path: public
      - name: Deploy Pages
        if: steps.commit.outputs.changed == 'true'
        id: deployment
        uses: actions/deploy-pages@v4
